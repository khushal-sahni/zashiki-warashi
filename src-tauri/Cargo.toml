[package]
name = "zashiki-warashi"
version = "0.1.0"
description = "Localhost control plane for local projects"
authors = ["you"]
edition = "2021"

[lib]
name = "zashiki_warashi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
log = "0.4"
